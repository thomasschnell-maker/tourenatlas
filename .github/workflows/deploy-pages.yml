# Veröffentlicht main auf GitHub Pages (Branch gh-pages) – nur wenn die Tests grün sind.
# Dazu kommen vorab berechnete Regionsdaten (Bergwege, Radrouten, Gipfel, Hütten), wöchentlich aufgefrischt.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # täglich 03:17 UTC: Regionsdaten vervollständigen bzw. Teile älter als eine Woche auffrischen

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      # Erfolgreiche Teilabfragen aufheben: scheitert ein Lauf an überlasteten Overpass-Servern, macht der nächste
      # dort weiter. Teile älter als eine Woche werden aufgefrischt, bis dahin bleibt der alte Stand (nie Rückschritt).
      - name: Teilabfragen aus dem Cache
        uses: actions/cache@v4
        with:
          path: site-data/chunks
          key: chunks-${{ hashFiles('js/overpass.js') }}-${{ github.run_id }}
          restore-keys: chunks-${{ hashFiles('js/overpass.js') }}-

      - name: Regionsdaten erzeugen (Overpass)
        continue-on-error: true # ohne Regionsdaten fragt die App live ab – Seite trotzdem veröffentlichen
        run: node tools/build-region.mjs site-data/cells site-data/chunks

      # Vorgegebene Touren: Ortsnamen → Koordinaten (nur Oberallgäu, Abstandsprüfung). Das Protokoll zeigt jede Station.
      - name: Vorgegebene Touren auflösen (Nominatim)
        continue-on-error: true
        run: node tools/resolve-tours.mjs data/touren-quelle.json site-data/touren.json

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          if [ -f site-data/touren.json ]; then cp site-data/touren.json _site/data/touren.json; fi
          if [ -f site-data/cells/index.json ]; then
            mkdir -p _site/data/cells
            cp -r site-data/cells/. _site/data/cells/
            echo "Regionsdaten: $(du -sh site-data/cells | cut -f1)"
          else
            echo "::warning::Keine Regionsdaten – App fragt Overpass live ab"
          fi

      - name: Nach gh-pages veröffentlichen (ohne Verlauf, damit wöchentliche Daten das Repo nicht aufblähen)
        working-directory: _site
        run: |
          git init -q -b gh-pages
          # Die .gitignore des Repos schliesst data/cells/ aus (dort nur lokale Testdaten) – für die Seite gilt sie nicht
          rm -f .gitignore
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          # Absicherung: vorhandene Regionsdaten müssen wirklich mit veröffentlicht werden
          if [ -f data/cells/index.json ] && [ "$(git ls-files data/cells | wc -l)" -lt 10 ]; then echo "::error::Regionsdaten fehlen im Commit"; exit 1; fi
          echo "Veröffentlicht: $(git ls-files | wc -l) Dateien, davon $(git ls-files data/cells | wc -l) Regionsdaten"
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
